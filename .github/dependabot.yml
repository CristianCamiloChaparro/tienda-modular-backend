# A03 Cadena de suministro: GitHub revisa cada semana las dependencias y abre PRs con las versiones
# que corrigen vulnerabilidades. Las alertas se ven en Security -> Dependabot.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
