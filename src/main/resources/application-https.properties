# ==========================================================
#  Perfil "https": TLS local con certificado autofirmado
#  Uso: ./scripts/generar-certificado.sh y luego
#       ./mvnw spring-boot:run -Dspring-boot.run.profiles=https
#  https://localhost:8443  (http://localhost:8080 redirige a https)
# ==========================================================
server.port=${HTTPS_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:file:certs/tienda-local.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:tienda-local}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tienda-local

# Puerto http adicional que solo redirige a https
app.http.redirect-port=${HTTP_PORT:8080}
app.security.require-https=true
server.servlet.session.cookie.secure=true
