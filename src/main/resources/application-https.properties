# ==========================================================
#  Perfil "https": TLS local con un certificado de mkcert (o autofirmado)
#  Uso: ./scripts/generar-certificado.sh y luego
#       ./mvnw spring-boot:run -Dspring-boot.run.profiles=https
#  https://localhost:8443  (http://localhost:8080 redirige a https)
#  La clave del certificado llega por SSL_PASSWORD (archivo .env), nunca escrita aqui.
# ==========================================================
server.port=${HTTPS_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:file:certs/tienda-local.p12}
server.ssl.key-store-password=${SSL_PASSWORD}
server.ssl.key-store-type=PKCS12

# Puerto http adicional que solo redirige a https
app.http.redirect-port=${HTTP_PORT:8080}
app.security.require-https=true
server.servlet.session.cookie.secure=true

# HSTS obliga a usar HTTPS en "localhost" con cualquier puerto: en local se usa una vigencia corta
# (5 minutos) para no romper otros proyectos que corran en http://localhost. En produccion es un ano.
app.security.hsts-max-age=${HSTS_MAX_AGE:300}
