# ==========================================================
#  Tienda en Linea Modular - Backend (Semana 11)
# ==========================================================
spring.application.name=tienda-modular-backend
server.port=${PORT:8080}

# ---------- Conexion a PostgreSQL ----------
# Se pueden sobrescribir con variables de entorno (DB_URL, DB_USER, DB_PASSWORD).
# Si no existen, se usan los valores por defecto de la derecha.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tienda_modular}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA / Hibernate (ORM) ----------
# update: crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- OpenAPI / Swagger UI ----------
springdoc.api-docs.path=/api/v1/api-docs
springdoc.swagger-ui.path=/api/v1/docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ---------- CORS (origen del futuro frontend Vite) ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---------- Datos de ejemplo al arrancar (solo si la BD esta vacia) ----------
app.seed.enabled=true
