# ==========================================================
#  Tienda en Linea Modular - Backend
# ==========================================================
spring.application.name=tienda-modular-backend
server.port=${PORT:8080}

# ---------- Conexion a PostgreSQL ----------
# Se pueden sobrescribir con variables de entorno: DB_URL completa, o DB_HOST/DB_PORT/DB_NAME
# (asi las entrega Render), mas DB_USER y DB_PASSWORD. Sin variables se usan los valores por defecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tienda_modular}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA / Hibernate (ORM) ----------
# update: crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- OpenAPI / Swagger UI ----------
springdoc.api-docs.path=/api/v1/api-docs
springdoc.swagger-ui.path=/api/v1/docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Swagger lee la cookie XSRF-TOKEN y la envia en la cabecera X-XSRF-TOKEN
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.with-credentials=true

# ---------- CORS (solo si el frontend llama a la API desde otro dominio) ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---------- Seguridad ----------
# Sesion en el servidor; la cookie JSESSIONID no es accesible desde JavaScript (mitiga robo por XSS)
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
# Detras de un proxy con HTTPS (Render, nginx) respeta X-Forwarded-Proto para saber que la peticion es segura
server.forward-headers-strategy=framework
# true = toda peticion http:// se redirige a https:// (ver perfil "https")
app.security.require-https=${REQUIRE_HTTPS:false}

# Administrador inicial: se crea solo si no existe ningun ADMIN y si ADMIN_PASSWORD esta definida.
# La contrasena nunca se versiona: se pasa por variable de entorno.
app.admin.nombre=${ADMIN_NOMBRE:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@tienda.com}
app.admin.password=${ADMIN_PASSWORD:}

# ---------- Datos de ejemplo al arrancar (solo si la BD esta vacia) ----------
app.seed.enabled=true
